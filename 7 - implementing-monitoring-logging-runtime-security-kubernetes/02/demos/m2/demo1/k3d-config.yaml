apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: m2-demo1
servers: 1
agents: 0

ports:
  - port: 30080:30080
    nodeFilters:
      - server:0
  - port: 9200:9200
    nodeFilters:
      - server:0

options:
  k3s:
    extraArgs:
      - arg: --disable=traefik,metrics-server
        nodeFilters:
          - server:*
