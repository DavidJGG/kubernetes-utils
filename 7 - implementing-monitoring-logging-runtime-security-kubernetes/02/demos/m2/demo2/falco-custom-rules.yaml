# Custom Falco rules for WiredBrain Coffee security monitoring
# These rules extend the default ruleset with organization-specific detections

customRules:
  wiredbrain-rules.yaml: |-
    # Detect reverse shell patterns - common attack technique
    - rule: Reverse Shell Spawned
      desc: >
        Detects potential reverse shell execution based on command patterns
        commonly used to establish remote shell access.
      condition: >
        spawned_process and
        proc.name in (bash, sh, ash, dash, ksh, zsh) and
        (proc.cmdline contains "/dev/tcp" or
         proc.cmdline contains "/dev/udp" or
         proc.cmdline contains "nc -e" or
         proc.cmdline contains "ncat -e") and
        container
      output: >
        Reverse shell detected
        (proc=%proc.name cmdline=%proc.cmdline
        user=%user.name container=%container.name pod=%k8s.pod.name ns=%k8s.ns.name)
      priority: CRITICAL
      tags: [network, shell, mitre_execution, T1059]

    # Detect service account token access from unexpected processes
    - rule: Service Account Token Read
      desc: >
        Detects when a process reads the Kubernetes service account token.
        This is commonly used by attackers to access the K8s API.
      condition: >
        open_read and
        fd.name startswith /var/run/secrets/kubernetes.io/serviceaccount and
        container and
        not proc.name in (kubectl, curl, wget)
      output: >
        Service account token accessed
        (file=%fd.name proc=%proc.name cmdline=%proc.cmdline
        user=%user.name container=%container.name pod=%k8s.pod.name ns=%k8s.ns.name)
      priority: WARNING
      tags: [filesystem, mitre_credential_access, T1528]

    # Detect crypto miner execution - common post-compromise activity
    - rule: Crypto Miner Execution
      desc: >
        Detects execution of known cryptocurrency mining software.
      condition: >
        spawned_process and
        (proc.name in (xmrig, minerd, minergate, cpuminer) or
         proc.cmdline contains "stratum+tcp" or
         proc.cmdline contains "pool.mining") and
        container
      output: >
        Crypto miner detected
        (proc=%proc.name cmdline=%proc.cmdline
        user=%user.name container=%container.name pod=%k8s.pod.name ns=%k8s.ns.name)
      priority: CRITICAL
      tags: [process, mitre_resource_hijacking, T1496]

    # Detect package manager execution in containers
    - rule: Package Manager In Container
      desc: >
        Detects package manager execution in containers, which may indicate
        an attacker installing tools or persistence mechanisms.
      condition: >
        spawned_process and
        proc.name in (apt, apt-get, yum, dnf, apk, pip, npm) and
        container
      output: >
        Package manager executed in container
        (proc=%proc.name cmdline=%proc.cmdline
        user=%user.name container=%container.name pod=%k8s.pod.name ns=%k8s.ns.name)
      priority: NOTICE
      tags: [process, mitre_persistence, T1546]
