# Prometheus scrape configuration for Falcosidekick metrics

extraScrapeConfigs: |
  - job_name: 'falcosidekick'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - falco
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        regex: falcosidekick
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        regex: "2801"
        action: keep
