apiVersion: v1
kind: Pod
metadata:
  name: attacker-hostpath
  labels:
    app: attacker
spec:
  containers:
  - name: attacker
    image: alpine:3.19
    command: ["sleep", "3600"]
    volumeMounts:
    - name: host-etc
      mountPath: /host-etc
      readOnly: true
  volumes:
  - name: host-etc
    hostPath:
      path: /etc
      type: Directory
