apiVersion: v1
kind: Pod
metadata:
  name: vendor-backup-agent
  labels:
    app: vendor-backup
spec:
  containers:
  - name: backup-agent
    image: alpine:3.19
    command: ["sleep", "3600"]
    securityContext:
      runAsUser: 0
    volumeMounts:
    - name: host-data
      mountPath: /backup
      readOnly: true
  volumes:
  - name: host-data
    hostPath:
      path: /var/lib/rancher
      type: Directory
